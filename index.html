<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WOLL FISH POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #0f172a; margin: 0; padding: 0; color: #1e293b; height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 480px; height: 100vh; background: #ffffff; display: flex; flex-direction: column; padding: 15px; }
        
        /* Header lebih ringkas */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .brand h1 { font-size: 18px; font-weight: 800; margin: 0; }
        
        /* Form lebih padat agar tidak scroll */
        .form-group { margin-bottom: 8px; }
        label { font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 2px; display: block; }
        select, input { width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 14px; font-weight: 600; background: #f8fafc; }
        
        /* Tombol Simpan selalu di posisi bawah tanpa scroll */
        .btn-main { margin-top: auto; padding: 16px; background: #0ea5e9; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; }
        
        .spinner { display: none; width: 18px; height: 18px; border: 3px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="brand"><h1>WOLL FISH</h1></div>
        <button onclick="toggleRekap()" style="border:none; background:#f1f5f9; padding:6px 12px; border-radius:15px; font-size:12px;">👁️ Laba</button>
    </div>

    <div class="form-group">
        <label>Ikan</label>
        <select id="pilihBarang"></select>
    </div>

    <div style="display:flex; gap:8px;">
        <div class="form-group" style="flex:1;">
            <label>Jumlah</label>
            <input type="number" id="qty" value="1" step="0.1">
        </div>
        <div class="form-group" style="flex:1;">
            <label>Satuan</label>
            <select id="satuan"><option value="Ons">Ons</option><option value="Kg">Kg</option></select>
        </div>
    </div>

    <div class="form-group">
        <label>Harga Jual (Total)</label>
        <input type="number" id="totalJual" placeholder="Rp...">
    </div>

    <!-- Tombol Simpan (margin-top: auto membuatnya selalu menempel di bawah tapi tidak kelebihan) -->
    <button class="btn-main" id="btnSimpan" onclick="simpanTransaksi()">
        <span id="btnText">Simpan Transaksi</span>
        <div class="spinner" id="btnSpinner"></div>
    </button>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxJfMcadKDG5bpS1x4xZ45zT5HA37rfYa_UzJyv3YcS687hayy2fTbGfYNCmK3iJs0dTg/exec";
    let produk = [];

    // Fungsi untuk memastikan data terkirim
    function simpanTransaksi() {
        let idx = document.getElementById('pilihBarang').value;
        let p = produk[idx];
        let data = {
            namaBarang: p.nama,
            modalKg: p.modalKg,
            qty: parseFloat(document.getElementById('qty').value),
            satuan: document.getElementById('satuan').value,
            totalOmzet: parseFloat(document.getElementById('totalJual').value)
        };

        // Animasi loading
        document.getElementById('btnSimpan').disabled = true;
        document.getElementById('btnText').style.display = "none";
        document.getElementById('btnSpinner').style.display = "block";

        fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify(data)
        }).then(() => {
            alert("Berhasil!");
            location.reload();
        });
    }
</script>
</body>
</html>
