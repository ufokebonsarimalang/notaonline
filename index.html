<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kasir WOL FISH</title>
    <style>
        /* Desain Full Screen */
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f1f5f9; padding: 0; margin: 0; color: #1e293b; height: 100vh; }
        .container { width: 100vw; min-height: 100vh; background: #fff; padding: 20px; box-sizing: border-box; }
        
        /* Font Besar & Jelas */
        h2 { font-size: 24px; font-weight: 900; margin: 0; text-align: center; }
        .subtitle { font-size: 14px; text-align: center; color: #64748b; margin-bottom: 20px; }
        
        .label { font-size: 16px; font-weight: 700; margin-top: 20px; color: #334155; }
        select, input { width: 100%; padding: 18px; margin-top: 8px; border: 2px solid #cbd5e1; border-radius: 12px; font-size: 18px; box-sizing: border-box; background: #f8fafc; }
        
        .btn { width: 100%; padding: 22px; background: #10b981; color: white; border: none; border-radius: 12px; font-weight: 900; margin-top: 30px; font-size: 20px; cursor: pointer; }
        
        /* Privasi Tombol */
        .privacy-btn { width: 100%; padding: 12px; background: #e2e8f0; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; margin-top: 20px; }
        
        .rekap-panel { display: none; background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 12px; padding: 20px; margin-top: 20px; font-size: 16px; }
        .rekap-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; }
        .highlight { color: #10b981; }
    </style>
</head>
<body>

<div class="container">
    <h2>WOL FISH</h2>
    <div class="subtitle">Pasar Blimbing - Malang</div>
    
    <label class="label">PILIH IKAN</label>
    <select id="pilihBarang" style="font-size: 18px;"></select>

    <div style="display:flex; gap:15px;">
        <div style="flex:1;">
            <label class="label">JUMLAH</label>
            <input type="number" id="qty" value="1" step="0.1">
        </div>
        <div style="flex:1;">
            <label class="label">SATUAN</label>
            <select id="satuan">
                <option value="Ons">Ons</option>
                <option value="Kg">Kg</option>
            </select>
        </div>
    </div>

    <label class="label">HARGA JUAL (TOTAL)</label>
    <input type="number" id="totalJual" placeholder="Masukkan Rp...">

    <button class="btn" id="btnSimpan" onclick="simpanTransaksi()">💾 SIMPAN TRANSAKSI</button>

    <button class="privacy-btn" onclick="toggleRekap()" id="btnPrivacy">👁️ LIHAT LABA HARI INI</button>

    <div class="rekap-panel" id="rekapPanel">
        <div class="rekap-row"><span>Omzet Hari Ini:</span> <span id="hOmzet">Rp 0</span></div>
        <div class="rekap-row highlight"><span>Laba Bersih:</span> <span id="hLaba">Rp 0</span></div>
        <hr>
        <div class="rekap-row"><span>Omzet Bulan Ini:</span> <span id="bOmzet">Rp 0</span></div>
        <div class="rekap-row highlight"><span>Laba Bersih:</span> <span id="bLaba">Rp 0</span></div>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxJfMcadKDG5bpS1x4xZ45zT5HA37rfYa_UzJyv3YcS687hayy2fTbGfYNCmK3iJs0dTg/exec";
    let produk = [];

    // Fungsi fetch data tetap sama seperti sebelumnya...
    window.onload = () => {
        fetch(WEB_APP_URL).then(r => r.json()).then(res => {
            produk = res.produk;
            let s = document.getElementById('pilihBarang');
            produk.forEach((p, i) => s.innerHTML += `<option value="${i}">${p.nama}</option>`);
            
            // Hitung Rekap
            const today = new Date().toISOString().split('T')[0];
            const currentMonth = today.substring(0, 7);
            let hO=0, hL=0, bO=0, bL=0;
            res.transaksi.forEach(t => {
                if(t.tanggal === today) { hO+=t.omzet; hL+=t.laba; }
                if(t.tanggal.startsWith(currentMonth)) { bO+=t.omzet; bL+=t.laba; }
            });
            document.getElementById('hOmzet').innerText = "Rp " + hO.toLocaleString();
            document.getElementById('hLaba').innerText = "Rp " + hLaba.toLocaleString();
            document.getElementById('bOmzet').innerText = "Rp " + bO.toLocaleString();
            document.getElementById('bLaba').innerText = "Rp " + bLaba.toLocaleString();
        });
    };

    function toggleRekap() {
        let p = document.getElementById('rekapPanel');
        p.style.display = (p.style.display === 'block') ? 'none' : 'block';
    }

    function simpanTransaksi() {
        // ... (fungsi simpan sama seperti sebelumnya)
        let idx = document.getElementById('pilihBarang').value;
        let qty = parseFloat(document.getElementById('qty').value);
        let totalJual = parseFloat(document.getElementById('totalJual').value);
        if(idx === "" || isNaN(qty) || isNaN(totalJual)) return alert("Isi semua data!");
        
        let p = produk[idx];
        fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({ namaBarang: p.nama, modalKg: p.modalKg, qty: qty, satuan: document.getElementById('satuan').value, totalOmzet: totalJual })
        }).then(() => { alert("Tersimpan!"); location.reload(); });
    }
</script>
</body>
</html>
