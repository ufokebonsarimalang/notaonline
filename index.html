<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir WOL FISH - Pasar Blimbing</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f1f5f9; padding: 12px; color: #1e293b; margin: 0; }
        .container { max-width: 400px; margin: auto; background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); position: relative; }
        
        /* Header Toko & Tombol Rahasia Privasi */
        .header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #e2e8f0; padding-bottom: 10px; margin-bottom: 12px; }
        .store-info h2 { color: #0f172a; margin: 0; font-size: 16px; font-weight: 800; }
        .store-info .subtitle { color: #64748b; font-size: 10px; font-weight: 600; text-transform: uppercase; }
        
        /* Tombol Mata Privasi */
        .privacy-btn { background: #e2e8f0; border: none; padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: 600; color: #475569; display: flex; align-items: center; gap: 4px; }
        .privacy-btn:active { background: #cbd5e1; }

        .live-date { text-align: center; color: #0ea5e9; font-size: 11px; margin-bottom: 14px; font-weight: 700; background: #f0f9ff; padding: 6px; border-radius: 8px; }

        .label { font-size: 11px; font-weight: 700; margin-top: 10px; display: block; color: #475569; text-transform: uppercase; }
        select, input { width: 100%; padding: 10px 12px; margin-top: 4px; border: 1px solid #cbd5e1; border-radius: 10px; box-sizing: border-box; font-size: 14px; outline: none; background: #f8fafc; }
        select:focus, input:focus { border-color: #0ea5e9; background: #fff; box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15); }

        /* Tombol Simpan Modern */
        .btn { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 10px; font-weight: 800; margin-top: 16px; cursor: pointer; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:active { transform: scale(0.98); background: #059669; }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }

        .spinner { display: none; width: 16px; height: 16px; border: 2px solid #ffffff; border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #0f172a; color: white; padding: 10px 20px; border-radius: 30px; font-size: 12px; font-weight: 600; box-shadow: 0 5px 15px rgba(0,0,0,0.2); z-index: 999; }

        /* Panel Rekap Rahasia (Modal / Hidden by default demi privasi) */
        .rekap-panel { display: none; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px; margin-top: 16px; font-size: 11px; animation: fadeIn 0.3s ease; }
        .rekap-panel.show { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .rekap-title { font-weight: 800; color: #0f172a; margin-bottom: 8px; text-align: center; border-bottom: 1px solid #cbd5e1; padding-bottom: 4px; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
        .rekap-row { display: flex; justify-content: space-between; margin-bottom: 4px; color: #475569; }
        .rekap-row.highlight { font-weight: 800; color: #10b981; border-top: 1px solid #e2e8f0; padding-top: 4px; margin-top: 4px; font-size: 12px; }
        .periode-teks { font-size: 9px; color: #64748b; font-weight: normal; }
    </style>
</head>
<body>

<div id="toast" class="toast">✨ Transaksi Berhasil Disimpan!</div>

<div class="container">
    <!-- Header dengan Tombol Privasi Mata -->
    <div class="header-flex">
        <div class="store-info">
            <h2>WOL FISH</h2>
            <div class="subtitle">Pasar Blimbing - Malang</div>
        </div>
        <button class="privacy-btn" onclick="toggleRekap()" id="btnPrivacy">
            👁️ <span id="privacyText">Buka Laporan</span>
        </button>
    </div>

    <div class="live-date" id="liveDate">📅 Memuat tanggal...</div>
    
    <label class="label">Pilih Ikan</label>
    <select id="pilihBarang"></select>

    <div style="display:flex; gap:10px;">
        <div style="flex:1;">
            <label class="label">Jumlah</label>
            <input type="number" id="qty" value="1" step="0.1">
        </div>
        <div style="flex:1;">
            <label class="label">Satuan</label>
            <select id="satuan">
                <option value="Ons">Ons</option>
                <option value="Kg">Kg</option>
            </select>
        </div>
    </div>

    <label class="label">Harga Jual (Total dari Pembeli)</label>
    <input type="number" id="totalJual" placeholder="Contoh: 10000">

    <button class="btn" id="btnSimpan" onclick="simpanTransaksi()">
        <span id="btnText">💾 Simpan Transaksi</span>
        <div class="spinner" id="btnSpinner"></div>
    </button>

    <!-- PANEL REKAP RAHASIA (Bisa disembunyikan/ditampilkan agar aman dari orang lewat) -->
    <div class="rekap-panel" id="rekapPanel">
        <!-- Hari Ini -->
        <div style="margin-bottom: 10px;">
            <div class="rekap-title">Hari Ini <span class="periode-teks" id="teksTglHariIni">--</span></div>
            <div class="rekap-row"><span>Omzet:</span> <span id="hOmzet">Rp 0</span></div>
            <div class="rekap-row highlight"><span>Laba Bersih:</span> <span id="hLaba">Rp 0</span></div>
        </div>

        <!-- Bulan Ini (Contoh: 1 - 7 Agustus) -->
        <div>
            <div class="rekap-title">Bulan Ini <span class="periode-teks" id="teksRentangBulan">--</span></div>
            <div class="rekap-row"><span>Omzet:</span> <span id="bOmzet">Rp 0</span></div>
            <div class="rekap-row highlight"><span>Laba Bersih:</span> <span id="bLaba">Rp 0</span></div>
        </div>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxJfMcadKDG5bpS1x4xZ45zT5HA37rfYa_UzJyv3YcS687hayy2fTbGfYNCmK3iJs0dTg/exec";
    let produk = [];
    let rekapTersembunyi = true;

    window.onload = () => {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('liveDate').innerText = "📅 " + now.toLocaleDateString('id-ID', options);
        
        // Format teks rentang tanggal bulan ini (misal: 1 s.d. 7 Agustus)
        let tglSkrg = now.getDate();
        let namaBulan = now.toLocaleString('id-ID', { month: 'long' });
        let tahunSkrg = now.getFullYear();
        document.getElementById('teksRentangBulan').innerText = `(1 s.d. ${tglSkrg} ${namaBulan})`;
        document.getElementById('teksTglHariIni').innerText = `(${tglSkrg} ${namaBulan})`;

        fetch(WEB_APP_URL)
            .then(r => r.json())
            .then(res => {
                produk = res.produk;
                let s = document.getElementById('pilihBarang');
                s.innerHTML = '<option value="">-- Pilih Ikan --</option>';
                produk.forEach((p, i) => s.innerHTML += `<option value="${i}">${p.nama} (Modal Rp ${p.modalKg.toLocaleString('id-ID')}/Kg)</option>`);

                hitungDanTampilkanRekap(res.transaksi);
            });
    };

    // Fungsi Tombol Mata untuk Privasi Laporan
    function toggleRekap() {
        let panel = document.getElementById('rekapPanel');
        let btnText = document.getElementById('privacyText');
        rekapTersembunyi = !rekapTersembunyi;

        if(rekapTersembunyi) {
            panel.classList.remove('show');
            btnText.innerText = "Buka Laporan";
        } else {
            panel.classList.add('show');
            btnText.innerText = "Tutup Laporan";
        }
    }

    function hitungDanTampilkanRekap(transaksi) {
        const today = new Date().toISOString().split('T')[0];
        const currentMonth = today.substring(0, 7);

        let hOmzet = 0, hLaba = 0;
        let bOmzet = 0, bLaba = 0;

        transaksi.forEach(t => {
            if (t.tanggal === today) {
                hOmzet += t.omzet; hLaba += t.laba;
            }
            if (t.tanggal.startsWith(currentMonth)) {
                bOmzet += t.omzet; bLaba += t.laba;
            }
        });

        document.getElementById('hOmzet').innerText = "Rp " + hOmzet.toLocaleString('id-ID');
        document.getElementById('hLaba').innerText = "Rp " + hLaba.toLocaleString('id-ID');

        document.getElementById('bOmzet').innerText = "Rp " + bOmzet.toLocaleString('id-ID');
        document.getElementById('bLaba').innerText = "Rp " + bLaba.toLocaleString('id-ID');
    }

    function simpanTransaksi() {
        let idx = document.getElementById('pilihBarang').value;
        let qty = parseFloat(document.getElementById('qty').value);
        let totalJual = parseFloat(document.getElementById('totalJual').value);

        if (idx === "" || isNaN(qty) || isNaN(totalJual)) {
            alert("Harap lengkapi semua kolom dengan benar!");
            return;
        }

        let btn = document.getElementById('btnSimpan');
        let txt = document.getElementById('btnText');
        let spin = document.getElementById('btnSpinner');
        
        btn.disabled = true;
        txt.style.display = "none";
        spin.style.display = "block";

        let p = produk[idx];
        fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({
                namaBarang: p.nama,
                modalKg: p.modalKg,
                qty: qty,
                satuan: document.getElementById('satuan').value,
                totalOmzet: totalJual
            })
        }).then(r => r.json()).then(res => {
            if(res.status === "OK") {
                let toast = document.getElementById('toast');
                toast.style.display = "block";
                setTimeout(() => { location.reload(); }, 1000);
            } else {
                alert("Gagal menyimpan transaksi.");
                btn.disabled = false;
                txt.style.display = "inline";
                spin.style.display = "none";
            }
        }).catch(() => {
            alert("Terjadi kesalahan jaringan.");
            btn.disabled = false;
            txt.style.display = "inline";
            spin.style.display = "none";
        });
    }
</script>
</body>
</html>
