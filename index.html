<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir WOL FISH - Pasar Blimbing</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f1f5f9; padding: 12px; color: #1e293b; margin: 0; }
        .container { max-width: 400px; margin: auto; background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        h2 { text-align: center; color: #0f172a; margin: 0 0 2px 0; font-size: 18px; font-weight: 800; }
        .subtitle { text-align: center; color: #64748b; font-size: 11px; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .live-date { text-align: center; color: #0ea5e9; font-size: 11px; margin-bottom: 16px; font-weight: 700; border-bottom: 2px dashed #e2e8f0; padding-bottom: 10px; }

        .label { font-size: 11px; font-weight: 700; margin-top: 12px; display: block; color: #475569; text-transform: uppercase; letter-spacing: 0.3px; }
        select, input { width: 100%; padding: 11px 12px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 10px; box-sizing: border-box; font-size: 14px; outline: none; background: #f8fafc; transition: all 0.2s; }
        select:focus, input:focus { border-color: #0ea5e9; background: #fff; box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15); }

        /* Tombol Simpan Modern dengan Spinner */
        .btn { width: 100%; padding: 13px; background: #10b981; color: white; border: none; border-radius: 10px; font-weight: 800; margin-top: 18px; cursor: pointer; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); transition: transform 0.1s, background 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:active { transform: scale(0.98); background: #059669; }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; }

        /* Animasi Spinner */
        .spinner { display: none; width: 16px; height: 16px; border: 2px solid #ffffff; border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Notifikasi Sukses Cantik (Menggantikan alert bawaan browser) */
        .toast { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #0f172a; color: white; padding: 10px 20px; border-radius: 30px; font-size: 12px; font-weight: 600; box-shadow: 0 5px 15px rgba(0,0,0,0.2); z-index: 999; }

        /* Kotak Rekap */
        .rekap-container { display: flex; gap: 10px; margin-top: 18px; }
        .rekap-card { flex: 1; background: #f8fafc; padding: 12px; border-radius: 10px; border: 1px solid #e2e8f0; font-size: 11px; }
        .rekap-title { font-weight: 800; color: #0f172a; margin-bottom: 8px; text-align: center; border-bottom: 1px solid #cbd5e1; padding-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .rekap-row { display: flex; justify-content: space-between; margin-bottom: 5px; color: #475569; }
        .rekap-row.highlight { font-weight: 800; color: #10b981; border-top: 1px solid #e2e8f0; padding-top: 5px; margin-top: 5px; font-size: 12px; }
    </style>
</head>
<body>

<div id="toast" class="toast">✨ Transaksi Berhasil Disimpan!</div>

<div class="container">
    <h2>WOL FISH</h2>
    <div class="subtitle">Pasar Blimbing - Malang</div>
    <div class="live-date" id="liveDate">Memuat tanggal...</div>
    
    <label class="label">Pilih Ikan</label>
    <select id="pilihBarang"></select>

    <div style="display:flex; gap:10px;">
        <div style="flex:1;">
            <label class="label">Jumlah</label>
            <input type="number" id="qty" value="1" step="0.1">
        </div>
        <div style="flex:1;">
            <label class="label">Satuan</label>
            <select id="satuan">
                <option value="Ons">Ons</option>
                <option value="Kg">Kg</option>
            </select>
        </div>
    </div>

    <label class="label">Harga Jual (Total dari Pembeli)</label>
    <input type="number" id="totalJual" placeholder="Contoh: 10000">

    <!-- Tombol Simpan Modern dengan Spinner -->
    <button class="btn" id="btnSimpan" onclick="simpanTransaksi()">
        <span id="btnText">💾 Simpan Transaksi</span>
        <div class="spinner" id="btnSpinner"></div>
    </button>

    <!-- Kotak Rekap (Omzet & Laba) -->
    <div class="rekap-container">
        <div class="rekap-card">
            <div class="rekap-title">Hari Ini</div>
            <div class="rekap-row"><span>Omzet:</span> <span id="hOmzet">Rp 0</span></div>
            <div class="rekap-row highlight"><span>Laba:</span> <span id="hLaba">Rp 0</span></div>
        </div>
        <div class="rekap-card">
            <div class="rekap-title">Bulan Ini</div>
            <div class="rekap-row"><span>Omzet:</span> <span id="bOmzet">Rp 0</span></div>
            <div class="rekap-row highlight"><span>Laba:</span> <span id="bLaba">Rp 0</span></div>
        </div>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxJfMcadKDG5bpS1x4xZ45zT5HA37rfYa_UzJyv3YcS687hayy2fTbGfYNCmK3iJs0dTg/exec";
    let produk = [];

    window.onload = () => {
        // Tampilkan Tanggal & Bulan otomatis real-time sesuai hari ini
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('liveDate').innerText = "📅 " + new Date().toLocaleDateString('id-ID', options);

        // Ambil data produk & rekap dari Google Sheet
        fetch(WEB_APP_URL)
            .then(r => r.json())
            .then(res => {
                produk = res.produk;
                let s = document.getElementById('pilihBarang');
                s.innerHTML = '<option value="">-- Pilih Ikan --</option>';
                produk.forEach((p, i) => s.innerHTML += `<option value="${i}">${p.nama} (Modal Rp ${p.modalKg.toLocaleString('id-ID')}/Kg)</option>`);

                hitungDanTampilkanRekap(res.transaksi);
            });
    };

    function hitungDanTampilkanRekap(transaksi) {
        const today = new Date().toISOString().split('T')[0];
        const currentMonth = today.substring(0, 7);

        let hOmzet = 0, hLaba = 0;
        let bOmzet = 0, bLaba = 0;

        transaksi.forEach(t => {
            if (t.tanggal === today) {
                hOmzet += t.omzet; hLaba += t.laba;
            }
            if (t.tanggal.startsWith(currentMonth)) {
                bOmzet += t.omzet; bLaba += t.laba;
            }
        });

        document.getElementById('hOmzet').innerText = "Rp " + hOmzet.toLocaleString('id-ID');
        document.getElementById('hLaba').innerText = "Rp " + hLaba.toLocaleString('id-ID');

        document.getElementById('bOmzet').innerText = "Rp " + bOmzet.toLocaleString('id-ID');
        document.getElementById('bLaba').innerText = "Rp " + bLaba.toLocaleString('id-ID');
    }

    function simpanTransaksi() {
        let idx = document.getElementById('pilihBarang').value;
        let qty = parseFloat(document.getElementById('qty').value);
        let totalJual = parseFloat(document.getElementById('totalJual').value);

        if (idx === "" || isNaN(qty) || isNaN(totalJual)) {
            alert("Harap lengkapi semua kolom dengan benar!");
            return;
        }

        // Aktifkan Efek Loading (Spinner menyala, tombol dikunci agar tidak double klik)
        let btn = document.getElementById('btnSimpan');
        let txt = document.getElementById('btnText');
        let spin = document.getElementById('btnSpinner');
        
        btn.disabled = true;
        txt.style.display = "none";
        spin.style.display = "block";

        let p = produk[idx];
        fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({
                namaBarang: p.nama,
                modalKg: p.modalKg,
                qty: qty,
                satuan: document.getElementById('satuan').value,
                totalOmzet: totalJual
            })
        }).then(r => r.json()).then(res => {
            if(res.status === "OK") {
                // Munculkan notifikasi toast cantik
                let toast = document.getElementById('toast');
                toast.style.display = "block";
                
                setTimeout(() => {
                    location.reload();
                }, 1000);
            } else {
                alert("Gagal menyimpan transaksi.");
                btn.disabled = false;
                txt.style.display = "inline";
                spin.style.display = "none";
            }
        }).catch(() => {
            alert("Terjadi kesalahan jaringan.");
            btn.disabled = false;
            txt.style.display = "inline";
            spin.style.display = "none";
        });
    }
</script>
</body>
</html>
