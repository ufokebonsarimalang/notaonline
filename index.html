<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Profesional - UFO Kebonsari</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #e2e8f0; padding: 16px; margin: 0; color: #1e293b; }
        .container { max-width: 420px; margin: auto; background: #ffffff; padding: 24px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid #cbd5e1; }
        
        /* Header Toko */
        .store-header { text-align: center; border-bottom: 2px dashed #cbd5e1; padding-bottom: 12px; margin-bottom: 16px; }
        .store-logo { width: 50px; height: 50px; object-fit: contain; margin-bottom: 4px; border-radius: 50%; border: 1px solid #ddd; }
        .store-name { font-size: 16px; font-weight: 900; letter-spacing: 1px; color: #0f172a; margin: 0; }
        .store-address { font-size: 11px; color: #64748b; margin: 2px 0; }
        .store-date { font-size: 10px; color: #64748b; margin-top: 6px; }

        .form-group { margin-bottom: 12px; font-family: 'Inter', sans-serif; }
        label { font-size: 11px; font-weight: 800; color: #475569; text-transform: uppercase; display: block; margin-bottom: 4px; }
        input, select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 13px; outline: none; }
        input:focus, select:focus { border-color: #6d28d9; box-shadow: 0 0 0 3px rgba(109,40,217,0.1); }

        /* Preview Struk Area */
        .receipt-preview { background: #f8fafc; border: 1px dashed #94a3b8; padding: 12px; border-radius: 8px; margin: 16px 0; font-size: 12px; }
        .receipt-title { font-weight: bold; text-align: center; margin-bottom: 8px; font-size: 13px; color: #334155; }
        .receipt-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .receipt-total { border-top: 1px solid #cbd5e1; margin-top: 8px; padding-top: 8px; font-weight: bold; display: flex; justify-content: space-between; font-size: 14px; color: #0f172a; }

        /* Action Buttons */
        .btn-container { display: flex; gap: 8px; margin-top: 16px; font-family: 'Inter', sans-serif; }
        .btn { flex: 1; padding: 12px 8px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 11px; text-transform: uppercase; transition: transform 0.1s; }
        .btn:active { transform: scale(0.97); }
        .btn-save { background: #475569; color: white; }
        .btn-wa { background: #25d366; color: white; }

        /* Loading spinner */
        .spinner { display: none; width: 14px; height: 14px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; margin: auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Nota -->
    <div class="store-header">
        <img src="logo.png" alt="Logo" class="store-logo" onerror="this.style.display='none'">
        <h2 class="store-name">UFO KEBONSARI MALANG</h2>
        <p class="store-address">Jl. Kebonsari No. XX, Malang</p>
        <p class="store-date" id="waktuTransaksi">-</p>
    </div>

    <!-- Form Input Kasir -->
    <div class="form-group">
        <label>Nama Customer</label>
        <input type="text" id="namaCust" placeholder="Nama Pembeli" oninput="updatePreview()">
    </div>
    
    <div class="form-group">
        <label>No. WhatsApp Customer</label>
        <input type="text" id="noWa" placeholder="08xxxxxxxxxx">
    </div>

    <div class="form-group">
        <label>Pilih Barang</label>
        <select id="pilihBarang" onchange="updatePreview()">
            <option value="|0">-- Pilih Barang --</option>
        </select>
    </div>

    <div class="form-group">
        <label>Jumlah (Qty)</label>
        <input type="number" id="qty" value="1" min="1" oninput="updatePreview()">
    </div>

    <!-- Preview Struk Layar -->
    <div class="receipt-preview">
        <div class="receipt-title">STRUK PENJUALAN</div>
        <div class="receipt-row">
            <span id="prevBarang">-</span>
            <span id="prevSubtotal">Rp 0</span>
        </div>
        <div class="receipt-total">
            <span>TOTAL:</span>
            <span id="prevTotal">Rp 0</span>
        </div>
    </div>

    <!-- 2 Tombol Utama -->
    <div class="btn-container">
        <button type="button" class="btn btn-save" id="btnSave" onclick="prosesTransaksi(false)">
            <span id="txtSave">Simpan Saja</span>
            <div class="spinner" id="spinSave"></div>
        </button>
        <button type="button" class="btn btn-wa" id="btnWa" onclick="prosesTransaksi(true)">
            <span id="txtWa">Simpan & Kirim WA</span>
            <div class="spinner" id="spinWa"></div>
        </button>
    </div>
</div>

<script>
    const WEB_APP_URL = "URL_WEB_APP_ANDA_DISINI";

    // Tampilkan waktu real-time
    window.onload = function() {
        const now = new Date();
        const options = { dateStyle: 'medium', timeStyle: 'short' };
        document.getElementById('waktuTransaksi').innerText = now.toLocaleString('id-ID', options);
        
        // Ambil produk dari Google Sheet
        fetch(WEB_APP_URL)
            .then(r => r.json())
            .then(res => {
                let select = document.getElementById('pilihBarang');
                res.produk.forEach(p => {
                    select.innerHTML += `<option value="${p.nama}|${p.harga}">${p.nama} (Rp ${p.harga.toLocaleString('id-ID')})</option>`;
                });
            }).catch(() => {
                alert("Gagal memuat daftar produk dari server.");
            });
    };

    // Update tampilan preview struk secara instan
    function updatePreview() {
        let barangVal = document.getElementById('pilihBarang').value.split('|');
        let namaBarang = barangVal[0] || "-";
        let harga = parseInt(barangVal[1]) || 0;
        let qty = parseInt(document.getElementById('qty').value) || 1;
        let total = harga * qty;

        document.getElementById('prevBarang').innerText = namaBarang !== "-" ? `${namaBarang} x${qty}` : "-";
        document.getElementById('prevSubtotal').innerText = "Rp " + total.toLocaleString('id-ID');
        document.getElementById('prevTotal').innerText = "Rp " + total.toLocaleString('id-ID');
    }

    // Fungsi Utama Transaksi (Kirim ke Sheet & Opsional ke WhatsApp)
    function prosesTransaksi(kirimWA) {
        let nama = document.getElementById('namaCust').value.trim();
        let wa = document.getElementById('noWa').value.trim();
        let barangVal = document.getElementById('pilihBarang').value.split('|');
        let qty = document.getElementById('qty').value;
        
        let namaBarang = barangVal[0];
        let harga = parseInt(barangVal[1]);
        let total = harga * qty;

        if (!nama || namaBarang === "") {
            alert("Harap isi Nama Customer dan pilih Barang terlebih dahulu!");
            return;
        }

        if (kirimWA && !wa) {
            alert("Nomor WhatsApp wajib diisi jika ingin mengirim nota via WhatsApp!");
            document.getElementById('noWa').focus();
            return;
        }

        // Aktifkan spinner loading pada tombol yang diklik
        const btnTarget = kirimWA ? document.getElementById('btnWa') : document.getElementById('btnSave');
        const txtTarget = kirimWA ? document.getElementById('txtWa') : document.getElementById('txtSave');
        const spinTarget = kirimWA ? document.getElementById('spinWa') : document.getElementById('spinSave');

        btnTarget.disabled = true;
        txtTarget.style.display = "none";
        spinTarget.style.display = "block";

        let rincianTeks = `${namaBarang} (${qty}x) - Rp ${total.toLocaleString('id-ID')}`;

        // 1. Kirim & Simpan ke Google Sheet
        fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({
                namaCust: nama,
                noWa: wa || "-",
                rincianBarang: rincianTeks,
                totalHarga: total
            })
        })
        .then(r => r.json())
        .then(res => {
            btnTarget.disabled = false;
            txtTarget.style.display = "block";
            spinTarget.style.display = "none";

            if (res.status === "OK") {
                if (kirimWA) {
                    // Format teks profesional ala struk untuk WhatsApp
                    let formatWaktu = document.getElementById('waktuTransaksi').innerText;
                    let pesanWA = `*UFO KEBONSARI MALANG*\n` +
                                  `-----------------------------------\n` +
                                  `📅 Tgl: ${formatWaktu}\n` +
                                  `👤 Cust: *${nama}*\n` +
                                  `-----------------------------------\n` +
                                  `*RINCIAN BELANJA:*\n` +
                                  `• ${rincianTeks}\n` +
                                  `-----------------------------------\n` +
                                  `*TOTAL TAGIHAN : Rp ${total.toLocaleString('id-ID')}*\n` +
                                  `-----------------------------------\n` +
                                  `Terima kasih telah berbelanja di UFO Kebonsari! 🙏`;

                    let cleanWa = wa.startsWith('0') ? '62' + wa.substring(1) : wa;
                    let waLink = `https://wa.me/${cleanWa}?text=` + encodeURIComponent(pesanWA);
                    window.open(waLink, '_blank');
                } else {
                    alert("Transaksi berhasil disimpan ke database!");
                }
                
                // Reset form setelah sukses
                document.getElementById('namaCust').value = "";
                document.getElementById('noWa').value = "";
                document.getElementById('qty').value = "1";
                document.getElementById('pilihBarang').selectedIndex = 0;
                updatePreview();
            } else {
                alert("Gagal menyimpan ke database.");
            }
        })
        .catch(() => {
            btnTarget.disabled = false;
            txtTarget.style.display = "block";
            spinTarget.style.display = "none";
            alert("Terjadi kesalahan koneksi server.");
        });
    }
</script>
</body>
</html>
